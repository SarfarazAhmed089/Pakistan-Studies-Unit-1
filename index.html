<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideological Basis of Pakistan MCQs</title>
<style>
:root{--blue:#d63384;--sky:#ff8fc7;--pale:#fff0f7;--ink:#54233f;--muted:#9a6a83;--line:#f6cfe2;--green:#159b62;--red:#df5363}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 5%,#ffe0ef,transparent 28%),radial-gradient(circle at 95% 10%,#ffe7f3,transparent 27%),linear-gradient(135deg,#fffafd,#fff0f7 55%,#fff8fc);min-height:100vh}
.container{width:min(940px,93%);margin:auto;padding:28px 0 42px}.hero{text-align:center;position:relative;overflow:hidden;padding:38px 22px;margin-bottom:20px;border:1px solid #f6c5dd;border-radius:25px;background:linear-gradient(135deg,#fff,#ffe4f1);box-shadow:0 12px 32px #b3267018}
.badge{display:inline-block;padding:8px 14px;border-radius:99px;background:#ffe0ef;color:#a51e62;border:1px solid #f3b4d2;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
h1{margin:17px 0 9px;font-size:clamp(30px,5vw,48px);line-height:1.15;color:#59213f}.subtitle{margin:0;color:var(--muted);font-size:16px;line-height:1.65}.author{display:inline-block;margin-top:14px;padding:9px 15px;background:#fff;border:1px solid var(--line);border-radius:10px;color:#b32670;font-size:14px;font-weight:700}
.progress{position:sticky;top:9px;z-index:5;display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:17px;border:1px solid var(--line);border-radius:14px;background:#fffafdF2;backdrop-filter:blur(12px);box-shadow:0 7px 22px #b3267014}.progress-text{min-width:125px;color:#a51e62;font-size:12px;font-weight:800}.track{height:9px;flex:1;overflow:hidden;border-radius:99px;background:#f9dce9}.fill{width:0;height:100%;background:linear-gradient(90deg,#ff9ccc,#d63384);border-radius:99px;transition:width .25s}
.question-card{padding:23px;margin-bottom:16px;border:1px solid var(--line);border-radius:19px;background:#fffafdF2;box-shadow:0 8px 24px #b3267012;transition:.2s}.question-card:hover{transform:translateY(-2px);border-color:#ee9dc5;box-shadow:0 13px 30px #267ead1b}.qno{display:inline-block;padding:6px 10px;margin-bottom:12px;border-radius:8px;background:#ffe5f1;color:#ad286b;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.question{font-size:18px;font-weight:750;line-height:1.55;margin-bottom:15px;color:#59213f}
.option{display:flex;align-items:center;gap:11px;padding:12px 14px;margin:9px 0;border:1.5px solid #f5dce8;border-radius:12px;background:#fffafd;color:#71415c;cursor:pointer;transition:.18s}.option:hover{border-color:#ed9bc2;background:#fff0f7;transform:translateX(2px)}.option input{accent-color:var(--blue);margin:0;flex-shrink:0}.letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:26px;border-radius:8px;background:#ffe2f0;color:#ad286b;font-size:12px;font-weight:800}
.correct{background:#e9faf2!important;border-color:#67c99b!important;color:#11653f!important}.correct .letter{background:var(--green);color:white}.wrong{background:#fff0f2!important;border-color:#e98c97!important;color:#9b2d3a!important}.wrong .letter{background:var(--red);color:white}
.actions{text-align:center;padding:12px 0 22px}button{border:0;border-radius:12px;padding:13px 23px;margin:5px;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px)}#submitBtn{background:linear-gradient(135deg,#c21870,#f46fb2);color:white;box-shadow:0 8px 20px #d6338435}#resetBtn{background:#ffe5f1;border:1px solid #f2b9d4;color:#a51e62}button:disabled{opacity:.55;cursor:not-allowed}
.result{display:none;text-align:center;padding:28px 20px;margin:8px 0 23px;border:1px solid #f2b9d4;border-radius:21px;background:linear-gradient(135deg,#fff,#ffe8f3);box-shadow:0 10px 30px #b3267018}.result h2{margin:0;color:#59213f}.score{font-size:clamp(42px,8vw,62px);font-weight:850;color:var(--blue);margin:10px 0}#message{color:var(--muted);font-weight:600}.footer{text-align:center;color:#a98398;font-size:12px;padding:8px 0}
@media(max-width:600px){.container{width:92%;padding-top:16px}.hero{padding:30px 16px;border-radius:20px}.question-card{padding:17px;border-radius:16px}.question{font-size:16px}.subtitle{font-size:14px}.progress-text{min-width:105px;font-size:11px}.option{padding:11px 10px}}
</style></head><body><div class="container">
<header class="hero"><span class="badge">Class 10th • Pakistan Studies • Unit 1</span><h1>Ideological Basis of Pakistan MCQs</h1><p class="subtitle">Class 10th P.S. Unit 1</p><div class="author">by Sarfaraz Ahmed · 19 Questions</div></header>
<div class="progress"><div class="progress-text" id="progressText">0 of 19 answered</div><div class="track"><div class="fill" id="progressFill"></div></div></div>
<main id="quiz"></main><div class="actions"><button id="submitBtn" onclick="submitQuiz()">✓ Submit Test</button><button id="resetBtn" onclick="resetQuiz()">↻ Reset Test</button></div>
<section class="result" id="result"><h2>Your Result</h2><div class="score" id="score"></div><p id="message"></p></section>
<div class="footer">Ideological Basis of Pakistan • Class 10th P.S. Unit 1 • Sarfaraz Ahmed</div></div>
<script>
const quizData = [{"q": "The origin of the word “ideology” is:", "options": ["French", "German", "Latin", "Arabic"], "answer": 0}, {"q": "It is made up of two components:", "options": ["Thinking", "Traditions", "Concepts", "Ideology"], "answer": 3}, {"q": "It is a universal Deen:", "options": ["Christianity", "Hinduism", "Islam", "Judaism"], "answer": 3}, {"q": "It is a complete code of life?", "options": ["Christianity", "Hinduism", "Islam", "Judaism"], "answer": 2}, {"q": "Islamic society was founded Islamic society?", "options": ["Hazrat Muhammad (S.A.W.)", "Hazrat Ali (R.A.)", "Hazrat Abu Bakr (R.A.)", "Hazrat Usman Ghani (R.A.)"], "answer": 0}, {"q": "It is the permanent basis of Islam?", "options": ["The Quran", "The Sunnah", "Traditions", "Cultural values"], "answer": 0}, {"q": "The term “Sunnah” comes from which language?", "options": ["Italian", "Persian", "Arabic", "English"], "answer": 2}, {"q": "It is the binding force for the nations in the world?", "options": ["Culture", "Cause", "Religion", "Dedication"], "answer": 2}, {"q": "It is the basis of the Ideology of Pakistan?", "options": ["Culture", "Cause", "Land", "Islam"], "answer": 3}, {"q": "Over how many years was the Quran revealed?", "options": ["20 years", "23 years", "25 years", "27 years"], "answer": 1}, {"q": "Which principle is the foundation of Divine Law?", "options": ["Equality", "Fraternity", "Tolerance", "Justice"], "answer": 3}, {"q": "What makes a society peaceful and prosperous?", "options": ["Religion", "Nationality", "A ruler", "Justice"], "answer": 3}, {"q": "The accumulation of wealth in the hands of a few was addressed through the establishment of:", "options": ["Namaz", "Fasting", "Zakat", "Hajj"], "answer": 2}, {"q": "What does “fraternity” mean?", "options": ["Fatherhood", "Neighbourhood", "Brotherhood", "Motherhood"], "answer": 2}, {"q": "In which year did Allama Iqbal deliver his presidential address at the All-India Muslim League’s annual meeting in Allahabad?", "options": ["1930", "1935", "1940", "1945"], "answer": 0}, {"q": "Allama Iqbal’s Allahabad address proved to be a milestone in the struggle for:", "options": ["Pakistan", "The Muslim League", "Congress", "The separation of Sindh"], "answer": 0}, {"q": "According to the provided answer key, in which year did Quaid-e-Azam elaborate the idea of a separate state for Muslims?", "options": ["1938", "1939", "1940", "1941"], "answer": 3}, {"q": "Where did Allama Iqbal speak about the Ideology of Pakistan in his presidential address?", "options": ["Allahabad", "Delhi", "Lucknow", "Madras"], "answer": 0}, {"q": "In which year did Allama Iqbal deliver his historic speech?", "options": ["1927", "1928", "1929", "1930"], "answer": 3}];
const quiz=document.getElementById("quiz"), progressText=document.getElementById("progressText"), progressFill=document.getElementById("progressFill");
function renderQuiz(){quiz.innerHTML="";quizData.forEach((item,index)=>{const card=document.createElement("section");card.className="question-card";const n=document.createElement("div");n.className="qno";n.textContent=`Question ${index+1}`;const q=document.createElement("div");q.className="question";q.textContent=item.q;card.append(n,q);item.options.forEach((option,i)=>{const label=document.createElement("label");label.className="option";label.dataset.question=index;label.dataset.option=i;label.innerHTML=`<input type="radio" name="q${index}" value="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${option}</span>`;label.querySelector("input").addEventListener("change",updateProgress);card.appendChild(label)});quiz.appendChild(card)});updateProgress()}
function updateProgress(){const n=document.querySelectorAll('input[type="radio"]:checked').length;progressText.textContent=`${n} of ${quizData.length} answered`;progressFill.style.width=`${n/quizData.length*100}%`}
function submitQuiz(){let score=0;quizData.forEach((item,index)=>{const selected=document.querySelector(`input[name="q${index}"]:checked`);document.querySelectorAll(`[data-question="${index}"]`).forEach(label=>{if(Number(label.dataset.option)===item.answer)label.classList.add("correct")});if(selected){if(Number(selected.value)===item.answer)score++;else{const wrong=document.querySelector(`[data-question="${index}"][data-option="${selected.value}"]`);if(wrong)wrong.classList.add("wrong")}}});document.getElementById("score").textContent=`${score} / ${quizData.length}`;const p=score/quizData.length*100;document.getElementById("message").textContent=p===100?"Outstanding! Perfect score!":p>=80?"Excellent work! Keep it up.":p>=60?"Good effort! Keep practising.":"Keep studying and try again!";document.getElementById("result").style.display="block";document.querySelectorAll('input[type="radio"]').forEach(x=>x.disabled=true);document.getElementById("submitBtn").disabled=true;document.getElementById("result").scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){renderQuiz();document.getElementById("result").style.display="none";document.getElementById("submitBtn").disabled=false;window.scrollTo({top:0,behavior:"smooth"})}
renderQuiz();
</script></body></html>
